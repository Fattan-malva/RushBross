[workspace]
resolver = "2"
members = [
    "apps/rushbross",
    "crates/rb-tabs",
    "crates/rb-bookmarks",
    "crates/rb-ui",
    "crates/rb-ui-widgets",
    "crates/rb-ui-renderer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rb-tabs = { path = "crates/rb-tabs" }
rb-bookmarks = { path = "crates/rb-bookmarks" }
rb-ui = { path = "crates/rb-ui" }
rb-ui-widgets = { path = "crates/rb-ui-widgets" }
rb-ui-renderer = { path = "crates/rb-ui-renderer" }

winit = "0.30.12"
wgpu = "30.0.2"
glyphon = "0.12.0"
cosmic-text = "0.19.0"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
url = "2.5"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
